<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">Little Hands: kindergarten management system</title>
<desc id="d">An Arabic-first, right-to-left management system for a kindergarten, built in ASP.NET Core 8 and MySQL: bus routing, tuition and arrears, absence alerts and printable Arabic documents.</desc>
<style>
.s{font-family:'Segoe UI',Tahoma,system-ui,-apple-system,'Geeza Pro','Noto Naskh Arabic',Arial,sans-serif}
.k{font:700 12px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#9C3D10;letter-spacing:2px}
.ar{font-size:40px;font-weight:800;fill:#3B2A1A}
.p{font-size:19px;font-weight:500;fill:#5A4632}
.c{font-size:15px;font-weight:700;fill:#2B1D10}
.f{font-size:14px;fill:#6E5843}
.route{stroke-dasharray:4 14;animation:go 1.6s linear infinite}
@keyframes go{to{stroke-dashoffset:-36}}
.bus{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.route,.bus{animation:none}}
</style>
<defs><clipPath id="c"><rect width="960" height="320" rx="18"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="960" height="320" fill="#FFF7E6"/>
<circle cx="930" cy="20" r="80" fill="#F7B32B" opacity=".35"/>
<circle cx="20" cy="320" r="70" fill="#3FA7D6" opacity=".25"/></g>
<rect x="46" y="42" width="350" height="240" rx="22" fill="#3B2A1A"/>
<rect x="40" y="36" width="350" height="240" rx="22" fill="#FFFFFF" stroke="#3B2A1A" stroke-width="3"/>
<path d="M60 120C120 96 160 150 220 128S330 80 372 104M70 220C150 196 230 250 372 214" stroke="#F1E6D2" stroke-width="10" fill="none" stroke-linecap="round"/>
<polyline class="route" points="96,236 150,180 232,206 300,150 250,92 150,90" fill="none" stroke="#F25C54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(78 222)"><path d="M0 14L18 0L36 14V36H0Z" fill="#F25C54" stroke="#3B2A1A" stroke-width="3" stroke-linejoin="round"/><rect x="13" y="20" width="10" height="16" fill="#FFF7E6" stroke="#3B2A1A" stroke-width="2"/></g>
<g stroke="#3B2A1A" stroke-width="3">
  <circle cx="150" cy="180" r="10" fill="#59CD90"/><circle cx="232" cy="206" r="10" fill="#3FA7D6"/><circle cx="300" cy="150" r="10" fill="#F7B32B"/><circle cx="250" cy="92" r="10" fill="#59CD90"/><circle cx="150" cy="90" r="10" fill="#3FA7D6"/>
</g>
<g class="bus" transform="translate(286 172)">
  <rect x="0" y="0" width="64" height="34" rx="9" fill="#F7B32B" stroke="#3B2A1A" stroke-width="3"/>
  <rect x="8" y="7" width="14" height="11" rx="3" fill="#FFFFFF" stroke="#3B2A1A" stroke-width="2"/><rect x="26" y="7" width="14" height="11" rx="3" fill="#FFFFFF" stroke="#3B2A1A" stroke-width="2"/><rect x="44" y="7" width="12" height="11" rx="3" fill="#FFFFFF" stroke="#3B2A1A" stroke-width="2"/>
  <circle cx="16" cy="36" r="6" fill="#3B2A1A"/><circle cx="48" cy="36" r="6" fill="#3B2A1A"/>
</g>
<g class="s">
  <text x="912" y="58" text-anchor="end" class="k">FULL STACK · ASP.NET CORE 8 · MYSQL</text>
  <text x="912" y="110" direction="rtl" text-anchor="start" class="ar">إدارة روضة Little Hands</text>
  <text x="912" y="144" text-anchor="end" class="p">Kindergarten management, Arabic-first</text>
  <g transform="translate(452 168)">
    <rect width="222" height="40" rx="20" fill="#59CD90" stroke="#3B2A1A" stroke-width="3"/><text x="111" y="26" text-anchor="middle" class="c">Bus routing (TSP)</text>
    <rect x="238" width="222" height="40" rx="20" fill="#F7B32B" stroke="#3B2A1A" stroke-width="3"/><text x="349" y="26" text-anchor="middle" class="c">Tuition &amp; arrears</text>
    <rect y="52" width="222" height="40" rx="20" fill="#3FA7D6" stroke="#3B2A1A" stroke-width="3"/><text x="111" y="78" text-anchor="middle" class="c">Absence alerts</text>
    <rect x="238" y="52" width="222" height="40" rx="20" fill="#FF8A80" stroke="#3B2A1A" stroke-width="3"/><text x="349" y="78" text-anchor="middle" class="c">Printable documents</text>
  </g>
  <text x="912" y="292" text-anchor="end" class="f">Web API v1 → MVC v2 · 20+ MySQL tables · strict CSP</text>
</g>
</svg>
