.m{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
.h{font-size:50px;font-weight:800;fill:#1D1B2E;letter-spacing:-1.5px}
.p{font-size:18px;fill:#4A4860}
.b{font-size:11px;fill:#FFFFFF}
.f{font-size:13px;fill:#6C63D8;font-weight:700}
</style>
<rect width="960" height="320" rx="18" fill="#FFFFFF"/>
<rect width="960" height="320" rx="18" fill="url(#g)"/>
<rect x=".5" y=".5" width="959" height="319" rx="18" fill="none" stroke="#E2E4EE"/>
<g class="m" transform="translate(48 40)">
  <rect width="56" height="20" rx="3" fill="#555"/><rect x="50" width="40" height="20" rx="3" fill="#6C63D8"/><rect x="50" width="6" height="20" fill="#6C63D8"/><text x="7" y="14" class="b">license</text><text x="57" y="14" class="b">MIT</text>
  <rect x="100" width="52" height="20" rx="3" fill="#555"/><rect x="146" width="36" height="20" rx="3" fill="#16916A"/><rect x="146" width="6" height="20" fill="#16916A"/><text x="107" y="14" class="b">charts</text><text x="153" y="14" class="b">115</text>
  <rect x="192" width="44" height="20" rx="3" fill="#555"/><rect x="230" width="44" height="20" rx="3" fill="#2F76C9"/><rect x="230" width="6" height="20" fill="#2F76C9"/><text x="199" y="14" class="b">build</text><text x="237" y="14" class="b">none</text>
</g>
<g class="s">
  <text x="46" y="122" class="h">OpenCharts</text>
  <text x="48" y="160" class="p">115 chart types you edit live and copy</text>
  <text x="48" y="184" class="p">as HTML, CSS and JavaScript.</text>
  <text x="48" y="222" class="p">Bring a table and it shows only the</text>
  <text x="48" y="246" class="p">charts that can actually read it.</text>
</g>
<text x="48" y="290" class="m f">6 renderers · Playwright E2E in CI · zero build step</text>
