<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">OpenCharts: 115 chart types with live, copyable code</title>
<desc id="d">A zero-build library of 115 chart types. Every chart opens in a studio where the data, colours and options are live and the HTML, CSS and JavaScript update as you edit. Match my data narrows the gallery to charts that can read your table.</desc>
