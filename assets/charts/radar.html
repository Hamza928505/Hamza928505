<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 32px;
  background: #ffffff;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}

.chart-card { width: 100%; max-width: 860px; }



.chart-card {
  /* The card is a figure now, and a figure carries a browser default
     margin of 1em 40px that the card never wanted. */
  margin: 0;
  background: radial-gradient(circle at 50% 42%, #1c2750, #0b1022 72%);
  border: 1px solid #2a3560;
  border-radius: 16px;
  padding: 20px;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: #e7ecff;
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 340px;
}

.chart-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 14px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #475569;
  cursor: pointer;
  user-select: none;
  transition: opacity .2s;
}

.legend-item.hidden { opacity: .35; }

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: 0 0 10px;
}

.legend-swatch.line { width: 16px; height: 2px; border-radius: 1px; }



.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.chart-data { margin-top: 14px; font-size: 13px; }
.chart-data > summary {
  cursor: pointer;
  color: #475569;
  padding: 4px 2px;
  border-radius: 4px;
}
.chart-data > summary:focus-visible { outline: 2px solid #15803d; outline-offset: 2px; }
/* Wide tables scroll in their own box; the page must never scroll sideways. */
.chart-data-scroll { overflow-x: auto; margin-top: 8px; }
.chart-data table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.chart-data caption { text-align: left; padding-bottom: 6px; color: #5c6b80; font-size: 12px; }
.chart-data th, .chart-data td {
  padding: 4px 10px 4px 0;
  text-align: left;
  border-bottom: 1px solid rgba(128,128,128,.22);
  white-space: nowrap;
}
.chart-data td { font-variant-numeric: tabular-nums; }


html { scrollbar-width: none; }
*, *::before, *::after { box-sizing: border-box; }
body { display: block; min-height: 0; padding: 0; background: transparent; }
.chart-wrap { height: min(90vw, 480px); }

/* the web-slinger swings on a thread from the top of the web, behind the data */
.chart-wrap { overflow: hidden; }
.chart-wrap canvas { position: relative; z-index: 1; }
.swing { position: absolute; left: 50%; top: -6%; width: 64px; height: 90%; margin-left: -32px; transform-origin: 50% 0; animation: swing 3.2s ease-in-out infinite alternate; pointer-events: none; }
.swing i { position: absolute; left: 50%; top: 0; bottom: 72px; width: 2px; margin-left: -1px; background: linear-gradient(#ffffff, #b9c6ff); box-shadow: 0 0 6px #b9c6ff; }
.swing svg { position: absolute; bottom: 0; left: 50%; width: 64px; height: 80px; margin-left: -32px; transform-origin: 50% 4px; animation: kick 3.2s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-34deg); } to { transform: rotate(34deg); } }
@keyframes kick { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
@media (prefers-reduced-motion: reduce) { .swing, .swing svg { animation: none; } .swing { transform: rotate(-24deg); } }
.legend-item { color: #c9d4ff; }
.chart-data > summary, .chart-data caption { color: #b7c3f0; }
.chart-data th, .chart-data td { color: #e7ecff; }

function effectRgb(color) {
  if (typeof color !== 'string') return null;
  const raw = color.trim().toLowerCase();
  if (raw[0] === '#') {
    const hex = raw.slice(1);
    if (![3, 4, 6, 8].includes(hex.length) || !/^[0-9a-f]+$/.test(hex)) return null;
    const full = hex.length <= 4 ? [...hex].map((c) => c + c).join('') : hex;

      .concat(full.length === 8 ? +(parseInt(full.slice(6), 16) / 255).toFixed(4) : 1);
  }
  const match = raw.match(/^(rgba?|hsla?)\((.*)\)$/);
  if (!match) return null;
  const parts = match[2].replace(/,/g, ' ').replace(/\s*\/\s*/g, ' ').trim().split(/\s+/);
  if (parts.length < 3) return null;
  const alpha = parts[3] == null ? 1 : (parts[3].endsWith('%') ? parseFloat(parts[3]) / 100 : Number(parts[3]));
  if (!Number.isFinite(alpha)) return null;
  if (match[1].startsWith('rgb')) {
    const rgb = parts.slice(0, 3).map((v) => v.endsWith('%') ? parseFloat(v) * 2.55 : Number(v));
    return rgb.every(Number.isFinite) ? [...rgb, Math.min(1, Math.max(0, alpha))] : null;
  }
  const h = parseFloat(parts[0]);
  const s = parseFloat(parts[1]) / 100;
  const l = parseFloat(parts[2]) / 100;
  if (![h, s, l].every(Number.isFinite)) return null;
  const a = s * Math.min(l, 1 - l);
  const channel = (n) => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  return [channel(0), channel(8), channel(4), Math.min(1, Math.max(0, alpha))];
}
function lighten(color, amount) {
  const rgb = effectRgb(color);
  if (!rgb) return color;
  const t = Math.min(1, Math.max(0, amount));
  return `rgba(${rgb.slice(0, 3).map((v) => Math.round(v + (255 - v) * t)).join(',')},${rgb[3]})`;
}
function darken(color, amount) {
  const rgb = effectRgb(color);

    const bottom = element?.base != null && element?.y != null ? Math.max(element.y, element.base)

  const strength = fx.gradient * (0.5 + effectTheme() * 0.5);
  const gradient = context.chart.ctx.createLinearGradient(area.left, area.top, area.right, area.bottom);
  gradient.addColorStop(0, lighten(color, 0.36 * strength));
  gradient.addColorStop(1, darken(color, 0.22 * strength));
  return gradient;

const config = {

  data: {

              : element?.height ? element.y + element.height / 2 : area.bottom;

        },

        pointRadius: 4,
        pointHoverRadius: 6,
        fill: true,
        _ocEffects: { enabled: true, glow: 0.5, gradient: 0.6, shadow: 0.4 },
        _ocGlowColor: '#FF3B4E',
        _ocFill: '#FF3B4E40'
      },
      {
        label: 'Certificates',
        data: [1, 0, 0, 0, 0, 2, 1, 7, 3, 2],
        borderColor: '#3D8BFF',
        backgroundColor: function chartFill(context) {
          const ds = context.dataset;
          const raw = ds._ocFill;
          const color = typeof raw === 'function' ? raw(context)
            : Array.isArray(raw) ? raw[(context.dataIndex || 0) % raw.length] : raw;
          const fx = ds._ocEffects;
          if (!fx?.enabled || !fx.gradient || !effectRgb(color)) return color;
          const { chart, element } = context;
          const area = chart.chartArea;
          if (!area) return color;
          const strength = fx.gradient * (0.5 + effectTheme() * 0.5);
          const type = ds.type || chart.config.type;

          if (['pie', 'doughnut', 'polarArea', 'radar', 'bubble', 'scatter'].includes(type) && element?.x != null) {

      // A spider's web instead of a grid: spokes to each skill, and silk rings that sag toward the middle between spokes.
      id: 'web',
      beforeDatasetsDraw: function (chart) {
        const r = chart.scales.r, ctx = chart.ctx, n = chart.data.labels.length;
        const cx = r.xCenter, cy = r.yCenter, rings = r.max / 2;

const chart = new Chart(document.getElementById('chart'), config);
window.addEventListener('beforeprint', () => chart.update('none'));
window.addEventListener('afterprint', () => chart.update('none'));

const legendItems = [
  {
    label: 'Jobs & projects',
    color: '#FF3B4E',
    line: true,
    datasetIndex: 0
  },
  { label: 'Certificates', color: '#3D8BFF', line: true, datasetIndex: 1 }
];

function buildLegend(containerId, items) {
  const host = document.getElementById(containerId);
  if (!host) return;
  host.innerHTML = '';
  items.forEach((item) => {
    const el = document.createElement('span');
    el.className = 'legend-item';
    const sw = document.createElement('span');
    sw.className = 'legend-swatch' + (item.line ? ' line' : '');
    sw.style.background = item.color;
    const text = document.createElement('span');
    text.textContent = item.label;
    el.append(sw, text);
    if (item.datasetIndex != null) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const meta = chart.getDatasetMeta(item.datasetIndex);
        meta.hidden = !meta.hidden;
        el.classList.toggle('hidden', !!meta.hidden);
        chart.update();
      });
    }
    host.appendChild(el);
  });
}

buildLegend('legend', legendItems);
