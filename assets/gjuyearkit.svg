<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">GJU German Year Kit</title>
<desc id="d">A free static website for German Jordanian University students planning the 20-week German Year internship: a rules guide, job boards with local filtering, and a browser-only profile editor.</desc>
