<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">CareerToAI: a profile site built for AI readers</title>
<desc id="d">A static Eleventy profile published as pre-rendered HTML, one plain-text file and raw JSON, with a robots.txt that welcomes every crawler by name. Certificates are drafted locally by a Claude vision model and edited by hand.</desc>
<defs>
  <pattern id="r" width="960" height="28" patternUnits="userSpaceOnUse" y="10"><path d="M0 27.5H960" stroke="#E8E4D8"/></pattern>
  <clipPath id="c"><rect width="960" height="320" rx="18"/></clipPath>
</defs>
<style>
.m{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
.n{font-size:13px;fill:#B0A99A}
.l{font-size:16px;fill:#2B2B2B}
.c{fill:#8C8577}
.v{fill:#1D4ED8}
.h{font-size:42px;font-weight:800;fill:#1F1F1F}
.p{font:500 18px 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#444444}
.f{font-size:13px;fill:#6B6458}
.cur{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
<g clip-path="url(#c)">
<rect width="960" height="320" fill="#FBFAF5"/>
<rect width="960" height="320" fill="url(#r)"/>
<path d="M84 0V320" stroke="#E4A0A0" stroke-width="2"/>
</g>
<rect x=".5" y=".5" width="959" height="319" rx="18" fill="none" stroke="#E2DED2"/>
<g class="m">
  <text x="66" y="50" text-anchor="end" class="n">1</text><text x="104" y="50" class="l c"># Every crawler, indexer and AI agent</text>
  <text x="66" y="78" text-anchor="end" class="n">2</text><text x="104" y="78" class="l c"># is explicitly welcome here.</text>
  <text x="66" y="134" text-anchor="end" class="n">4</text><text x="104" y="134" class="l">User-agent: <tspan class="v">*</tspan></text>
  <text x="66" y="162" text-anchor="end" class="n">5</text><text x="104" y="162" class="l">Allow: /</text>
  <text x="66" y="218" text-anchor="end" class="n">7</text><text x="104" y="218" class="l">User-agent: <tspan class="v">ClaudeBot</tspan></text>
  <text x="66" y="246" text-anchor="end" class="n">8</text><text x="104" y="246" class="l">Allow: /<tspan class="cur">▌</tspan></text>
  <text x="66" y="106" text-anchor="end" class="n">3</text><text x="66" y="190" text-anchor="end" class="n">6</text>
  <text x="66" y="274" text-anchor="end" class="n">9</text><text x="66" y="302" text-anchor="end" class="n">10</text>
</g>
<rect x="526" y="80" width="300" height="34" fill="#FFE58A"/>
<text x="530" y="58" class="m f" font-weight="700" letter-spacing="2">ROBOTS.TXT · LLMS.TXT · JSON</text>
<text x="528" y="110" class="m h">CareerToAI</text>
<text x="530" y="152" class="p">A profile site built for AI readers.</text>
<text x="530" y="188" class="p">LinkedIn blocks bots; this one invites</text>
<text x="530" y="212" class="p">them: HTML, plain text and raw JSON.</text>
<text x="530" y="270" class="m f">Eleventy · GitHub Pages · Claude vision</text>
</svg>
