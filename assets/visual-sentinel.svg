<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">Visual Sentinel: two Raspberry Pi nodes locate a drone in 3D</title>
<desc id="d">Graduation project. Two Raspberry Pi nodes, PI 01 and PI 02, each carry a camera, an IMU and a GPS receiver. Their sight lines meet on a drone; depth comes from the baseline between them, Z = f·B/d. 107 field experiments, two depth estimators, no cloud.</desc>
<defs>
  <linearGradient id="fx" x1="0" x2="1"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff"/></linearGradient>
  <mask id="fade"><rect width="960" height="420" fill="url(#fx)"/></mask>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B14"/><stop offset="1" stop-color="#050B14" stop-opacity="0"/></linearGradient>
  <linearGradient id="horizon" x1="0" x2="1"><stop offset="0" stop-color="#00D9FF" stop-opacity="0"/><stop offset=".6" stop-color="#00D9FF" stop-opacity=".5"/><stop offset="1" stop-color="#00D9FF" stop-opacity=".1"/></linearGradient>
  <linearGradient id="cone" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#00D9FF" stop-opacity=".22"/><stop offset="1" stop-color="#00D9FF" stop-opacity=".02"/></linearGradient>
  <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B4A63"/><stop offset="1" stop-color="#123247"/></linearGradient>
  <clipPath id="frame"><rect width="960" height="420" rx="18"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
.k{font-size:12px;font-weight:700;fill:#00FF88;letter-spacing:2px}
.h{font-size:38px;font-weight:800;fill:#E6F7FF;letter-spacing:3px}
.p{font-size:15px;fill:#9FC3D1}
.v{font-size:26px;font-weight:800;fill:#00D9FF}
.u{font-size:10px;font-weight:700;fill:#7FA6B5;letter-spacing:1px}
.f{font-size:12px;fill:#5B8394;letter-spacing:1px}
.t{font-size:10px;font-weight:700;letter-spacing:1px}
.t.g{fill:#00FF88} .t.c{fill:#00D9FF} .t.w{fill:#CFE9F2} .t.s{fill:#5B8394;font-weight:400}
.t.n{font-size:13px;fill:#E6F7FF;letter-spacing:2px}
.leg{stroke:#3E6A80;stroke-width:2.5;stroke-linecap:round}
.top{fill:url(#lid);stroke:#00D9FF;stroke-opacity:.5} .back{fill:#0B2232;stroke:#00D9FF;stroke-opacity:.8} .side{fill:#061521;stroke:#00D9FF;stroke-opacity:.4}
.ray{stroke:#00D9FF;stroke-width:1.5;stroke-dasharray:6 6;stroke-dashoffset:12;animation:flow 1s linear infinite}
.gps{stroke:#00FF88;stroke-opacity:.35;stroke-dasharray:2 6}
.dim{stroke:#00FF88;stroke-opacity:.6;stroke-dasharray:3 5}
.base{stroke:#00D9FF;stroke-width:2.5}
.rotor{transform-box:fill-box;transform-origin:center;animation:spin .14s linear infinite alternate}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.p2{animation-delay:1.2s}
.hover{animation:hover 2.6s ease-in-out infinite alternate}
.rec,.lock{animation:blink 1.2s steps(1) infinite}
.scan{animation:scan 2.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:scaleX(.3)}}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes hover{to{transform:translateY(-3px)}}
@keyframes blink{50%{opacity:.2}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
