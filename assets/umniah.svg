<path d="M48 176H836" stroke="#0092BC" stroke-width="3" stroke-linecap="round" opacity=".55"/>
<path class="pulse" d="M48 176H836"/>
<path class="pulse" d="M48 176H836" style="animation-delay:1.6s"/>
