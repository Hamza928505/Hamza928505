<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 332" width="960" height="332" role="img" aria-labelledby="t d">
<title id="t">Umniah by Beyon, Digital and IT: three summers on Jordan's network, 2023 to 2025</title>
<desc id="d">A 5G mast broadcasts while a light pulse runs along a fibre line through three summers. 2023 front end: 57 responsive pages. 2024 back end: a login and user-management system with full CRUD in C# and .NET. 2025 full stack: a customer-complaints system built alone, still in production.</desc>
<style>
.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
.k{font-size:12px;font-weight:700;fill:#B7C9D3;letter-spacing:2px}
.h{font-size:34px;font-weight:800;fill:#FFFFFF;letter-spacing:-.5px}
.p{font-size:16px;fill:#B7C9D3}
.y{font-size:28px;font-weight:800;fill:#FFFFFF}
.r{font-size:12px;font-weight:700;fill:#FFFFFF;letter-spacing:1.5px}
.l{font-size:17px;font-weight:600;fill:#FFFFFF}
.q{font-size:14px;fill:#B7C9D3}
.off{fill:#3A4766}
.wave{fill:none;stroke:#CE0037;stroke-width:4;stroke-linecap:round;animation:wave 1.8s ease-in-out infinite}
.w2{animation-delay:.3s}.w3{animation-delay:.6s}
.pulse{fill:none;stroke:#7FE3FF;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 900;stroke-dashoffset:960;animation:run 3.2s linear infinite}
.ring{fill:none;stroke:#CE0037;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 3.2s ease-out infinite}
.live{fill:none;stroke:#26D07C;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:live 1.6s ease-out infinite}
.beacon{animation:blink 1.2s steps(1) infinite}
@keyframes wave{0%,100%{opacity:.15}40%{opacity:1}}
@keyframes run{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.6);opacity:1}35%{transform:scale(2.4);opacity:0}100%{opacity:0}}
@keyframes live{from{transform:scale(1);opacity:1}to{transform:scale(3);opacity:0}}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:0}.pulse{opacity:0}}
</style>
<rect width="960" height="332" rx="18" fill="#202A44"/>

<rect x="48" y="40" width="10" height="10" rx="3" fill="#CE0037"/>
<text x="66" y="50" class="m k">EXPERIENCE · UMNIAH BY BEYON · DIGITAL &amp; IT</text>
<text x="46" y="94" class="s h">Three summers on Jordan's network</text>
<text x="48" y="124" class="s p">Dual Studies programme · July to October each year, 2023 → 2025</text>

