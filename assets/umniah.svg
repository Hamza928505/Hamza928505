  <text x="46" y="27" class="s y">2023</text>
  <rect y="40" width="98" height="22" rx="11" fill="#CE0037"/><text x="11" y="55" class="m r">FRONT END</text>
  <text x="0" y="88" class="s l">57 responsive web pages</text>
  <text x="0" y="110" class="s q">HTML · CSS · JS · Bootstrap 5 · jQuery</text>
</g>
<g transform="translate(348 196)">
  <rect x="0" y="16" width="9" height="12" rx="2" fill="#CE0037"/><rect x="13" y="8" width="9" height="20" rx="2" fill="#CE0037"/><rect x="26" y="0" width="9" height="28" rx="2" class="off"/>
  <text x="46" y="27" class="s y">2024</text>
  <rect y="40" width="90" height="22" rx="11" fill="#CE0037"/><text x="11" y="55" class="m r">BACK END</text>
  <text x="0" y="88" class="s l">Login + user management, full CRUD</text>
  <text x="0" y="110" class="s q">C# · .NET · REST APIs · SQL · Postman</text>
</g>
<g transform="translate(648 196)">
  <rect x="0" y="16" width="9" height="12" rx="2" fill="#CE0037"/><rect x="13" y="8" width="9" height="20" rx="2" fill="#CE0037"/><rect x="26" y="0" width="9" height="28" rx="2" fill="#CE0037"/>
  <text x="46" y="27" class="s y">2025</text>
  <rect y="40" width="108" height="22" rx="11" fill="#CE0037"/><text x="11" y="55" class="m r">FULL STACK</text>
  <text x="0" y="88" class="s l">Complaints system, built alone</text>
  <circle cx="5" cy="105" r="4" fill="#26D07C"/><circle class="live" cx="5" cy="105" r="4"/>
