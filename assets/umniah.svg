<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">Umniah, Digital and IT: three summers, 2023 to 2025</title>
<desc id="d">2023 front end: 57 responsive pages. 2024 back end: a login and user-management system with full CRUD in C# and .NET. 2025 full stack: a customer-complaints system built alone, still in production.</desc>
<style>
.k{font:700 12px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;letter-spacing:2px}
.h{font:800 34px 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#F3EEFF;letter-spacing:-.5px}
